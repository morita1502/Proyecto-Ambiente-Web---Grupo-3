<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <!--Links de Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--Links propios-->
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/login.js"></script>
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <!--Logo y nombre-->
            <div class="text-center mb-4">
                <img src="../../img/logo.png" alt="Logo de Cortes de Agua Costa Rica" class="logo">
                <h1 class="system-title">Cortes de Agua</h1>
                <p class="system-subtitle">Costa Rica</p>
                <p class="welcome-text">¡Bienvenido! Inicia sesión en tu cuenta</p>
            </div>

            <!--Formulario-->
            <form id="loginForm">
                <!--Correo-->
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>
                <!--Contraseña-->
                <div class="mb-3">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>

                        <button class="btn btn-outline-secondary" type="button" id="mostrarContrasena">
                            Mostrar
                        </button>
                    </div>
                </div>
                <!--Recuperar contraseña-->
                <div class="text-end mb-4">
                    <a href="forgetpassword.html" class="login-link">¿Olvidaste tu contraseña?</a>
                </div>
                <!--Boton-->
                <button type="submit" class="btn btn-login w-100">Iniciar sesión</button>
            </form>

            <!--Registro-->
            <div class="text-center mt-4">
                <p class="register-text">
                    ¿No tienes una cuenta?
                    <a href="signin.html" class="login-link">
                        Regístrate aquí
                    </a>
                </p>
            </div>

            <p class="footer-text text-center">Infórmate • Prepárate • Conecta</p>
        </section>
    </main>
</body>
</html>
