<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Cortes</title>
    <!--Links de Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--Links propios-->
    <link rel="stylesheet" href="../css/panel.css">
    <script src=""></script>
</head>
<header>
    <div class="barra">
        <div class="barra-logo">
            <img src="../../img/logo.png" alt="Logo de Cortes de Agua Costa Rica" class="logo">
            <strong>Registro de Cortes</strong>
        </div>
        <nav>
            <a href="../ModuloAdministrativo/inicioAdmin.html">Panel</a>
            <a href="../ModuloAdministrativo/gestionCortes.html">Gestión de cortes</a>
            <a href="../Login/login.html">Notificaciones</a>
            <a href="../ModuloAdministrativo/perfil.html">Perfil</a>
        </nav>
    </div>
</header>

<body>
    <div class="container mt-4 header-section">
        <div>
            <h2><strong>Registro de cortes nuevos</strong></h2>
            <p>Aquí puedes registrar nuevos cortes de agua.</p>
        </div>
        <div>
            <a href="../ModuloAdministrativo/gestionCortes.html" class="btn btn-success">Guardar</a>
            <a href="../ModuloAdministrativo/gestionCortes.html" class="btn btn-secondary">Cancelar</a>
        </div>
    </div>
    <div class="container mt-4 p-3 border rounded">
        <form>
            <div class="row g-3">
                <div class="col-12">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text" id="titulo" class="form-control" placeholder="Ingrese título del corte">
                </div>

                <div class="col-md-4">
                    <label for="provincia" class="form-label">Provincia</label>
                    <input type="text" id="provincia" class="form-control" placeholder="Ingrese la provincia del corte">
                </div>

                <div class="col-md-4">
                    <label for="canton" class="form-label">Cantón</label>
                    <input type="text" id="canton" class="form-control" placeholder="Ingrese el cantón del corte">
                </div>

                <div class="col-md-4">
                    <label for="distrito" class="form-label">Distrito</label>
                    <input type="text" id="distrito" class="form-control" placeholder="Ingrese el distrito del corte">
                </div>

                <div class="col-12">
                    <label for="fechaInicio" class="form-label">Fecha de inicio</label>
                    <input type="date" id="fechaInicio" class="form-control">
                </div>
                
                <div class="col-12">
                    <label for="horaInicio" class="form-label">Hora de inicio</label>
                    <input type="time" id="horaInicio" class="form-control">
                </div>

                <div class="col-12">
                    <label for="estado" class="form-label">Estado</label>
                    <select id="estado" class="form-select">
                        <option value="">Seleccione estado</option>
                        <option value="programado">Programado</option>
                        <option value="activo">Activo</option>
                        <option value="finalizado">Finalizado</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="razon" class="form-label">Razón</label>
                    <textarea id="razon" class="form-control" rows="4" placeholder="Ingrese la razón del corte"></textarea>
                </div>

                <div class="col-12">
                    <label for="borrador" class="form-label">Borrador</label>
                    <input type="checkbox" id="borrador" class="form-check-input">
                </div>
            </div>
        </form>
    </div>
</body>
