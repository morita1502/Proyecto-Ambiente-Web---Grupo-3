<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <!--Links de Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!--Links propios-->
    <link rel="stylesheet" href="styles.css">
    <script src="js/forgetpassword.js"></script>
</head>

<body>
    <main class="login-container">
        <section class="login-card recovery-card">
            <!--Logo y nombre del sistema-->
            <div class="text-center mb-4">
                <img src="../img/logo2.png" alt="Logo de Cortes de Agua Costa Rica" class="logo2">
                <h2 class="recovery-title">¿Olvidaste tu contraseña?</h2>

                <p class="welcome-text">
                    Ingresa tu correo electrónico y te enviaremos las instrucciones para recuperar tu cuenta
                </p>
            </div>

            <!--Formulario de recuperacion-->
            <form id="recuperarForm">
                <div class="mb-4">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                    <div class="invalid-feedback">
                        Ingresa un correo electrónico válido
                    </div>
                </div>

                <!--Mensaje de confirmacion-->
                <div id="mensajeConfirmacion" class="alert alert-success d-none" role="status" aria-live="polite"></div>

                <!-- Mensaje de error -->
                <div id="mensajeError"class="alert alert-danger d-none"role="alert"></div>

                <button type="submit" class="btn btn-login w-100">
                    Enviar instrucciones
                </button>

                <!-- Volver al login -->
                <a href="login.html" class="btn btn-outline-primary w-100 mt-3">
                    Volver al inicio de sesión
                </a>
            </form>
        </section>
    </main>
</body>
</html>
